<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Background tile -->
  <rect width="192" height="192" rx="32" fill="#1e1f22"/>

  <!-- Antenna -->
  <rect x="116" y="8" width="10" height="50" rx="5" fill="#5865f2"/>
  <!-- Antenna base bump -->
  <rect x="112" y="48" width="18" height="10" rx="4" fill="#5865f2"/>

  <!-- Radio body -->
  <rect x="44" y="52" width="104" height="132" rx="14" fill="#5865f2"/>

  <!-- Speaker grille (darker slots) -->
  <rect x="60" y="66" width="72" height="5" rx="2" fill="#3b44c0"/>
  <rect x="60" y="76" width="72" height="5" rx="2" fill="#3b44c0"/>
  <rect x="60" y="86" width="72" height="5" rx="2" fill="#3b44c0"/>

  <!-- Screen bezel -->
  <rect x="56" y="100" width="80" height="48" rx="6" fill="#1e1f22"/>
  <!-- Screen glow -->
  <rect x="60" y="104" width="72" height="40" rx="4" fill="#23a55a" opacity="0.9"/>
  <!-- Signal arc on screen -->
  <path d="M80 132 Q96 116 112 132" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M72 140 Q96 110 120 140" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>
  <circle cx="96" cy="136" r="4" fill="white"/>

  <!-- PTT button (left side protrusion) -->
  <rect x="30" y="106" width="14" height="28" rx="6" fill="#f0b232"/>

  <!-- Bottom button row -->
  <circle cx="75" cy="164" r="7" fill="#3b44c0"/>
  <circle cx="96" cy="164" r="7" fill="#3b44c0"/>
  <circle cx="117" cy="164" r="7" fill="#3b44c0"/>
</svg>
